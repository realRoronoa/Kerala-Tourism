name: NATPAC Kerala Mobility Platform CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend & ML Microservice Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: kerala_mobility
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kerala-mobility-platform/backend/requirements.txt

      - name: Verify Backend Syntax & Import Integrity
        run: |
          cd kerala-mobility-platform/backend
          python -c "import app.main; print('Backend Build Passed!')"

      - name: Install ML Microservice Dependencies
        run: |
          pip install -r kerala-mobility-platform/ml_service/requirements.txt

      - name: Verify ML Microservice Syntax
        run: |
          cd kerala-mobility-platform/ml_service
          python -c "import app.main; print('ML Microservice Build Passed!')"
